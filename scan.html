<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFin AI Scan - Solusi Cerdas Plastik</title>
    <link rel="icon" type="image/png" href="Images/Logo.png">
    <link rel="stylesheet" href="Style.Css">
</head>
<body>

    <nav>
        <div class="logo-wrapper">
            <img src="Images/Logo.png" alt="Logo EcoFin" class="nav-logo-img">
            <span class="logo-text">ECOFIN</span>
        </div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-list">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="kalkulator.html">Kalkulator</a></li>
            <li><a href="games.html">Mini Games</a></li>
            <li><a href="scan.html" style="color: var(--accent-blue);">AI Scan</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><button id="dark-mode-toggle">🌙</button></li>
        </ul>
    </nav>

    <div class="calc-container reveal active" style="padding-top: 140px; text-align: center;">
        <h2>EcoFin AI Scanner 📸</h2>
        <p>Arahkan kamera ke sampah plastik untuk deteksi otomatis.</p>
        
        <div id="webcam-container" style="margin: 30px auto; border: 5px solid var(--nature-green); border-radius: 20px; overflow: hidden; width: 320px; height: 240px; background: #000; display: flex; align-items: center; justify-content: center; margin-left: auto; margin-right: auto;">
            <p style="color: white; padding: 20px;">Kamera belum aktif</p>
        </div>
        
        <button type="button" class="btn-play" onclick="init()" style="padding: 15px 35px; background: var(--nature-green); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold;">Mulai Kamera</button>
        
        <div id="label-container" style="margin-top: 25px; min-height: 60px; display: flex; justify-content: center; align-items: center;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/ChYCkSsnW/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // Load model
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Setup webcam (Kamera Belakang)
                const flip = false; 
                webcam = new tmImage.Webcam(320, 240, flip); 
                await webcam.setup({ facingMode: "environment" }); 
                await webcam.play();
                
                window.requestAnimationFrame(loop);

                // Masukkan ke UI
                const container = document.getElementById("webcam-container");
                container.innerHTML = ""; 
                container.appendChild(webcam.canvas);
                
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "Siap mendeteksi...";
            } catch (err) {
                console.error(err);
                alert("Gagal mengakses kamera. Pastikan izin kamera sudah diberikan.");
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let highestProb = 0;
            let bestClassName = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClassName = prediction[i].className;
                }
            }

            // Logika Deteksi 60%
            if (highestProb < 0.60) {
                labelContainer.innerHTML = `
                    <div style="padding: 15px; background: #ffe5e5; color: #d63031; border-radius: 10px; font-weight: bold; border: 2px solid #ff7675; width: 280px;">
                        ⚠ Sampah Tidak Terdeteksi
                    </div>`;
            } else {
                const probabilityPercent = (highestProb * 100).toFixed(0);
                labelContainer.innerHTML = `
                    <div style="padding: 15px; background: #dff9fb; color: #1b4332; border-radius: 10px; font-weight: bold; border: 2px solid #2d6a4f; width: 280px;">
                        <span style="float: left;">${bestClassName}</span>
                        <span style="float: right;">${probabilityPercent}%</span>
                    </div>`;
            }
        }

        // Hamburger & Dark Mode
        const menu = document.querySelector('#mobile-menu');
        const menuLinks = document.querySelector('.nav-list');
        if(menu) {
            menu.onclick = () => {
                menu.classList.toggle('is-active');
                menuLinks.classList.toggle('active');
            };
        }

        const toggleBtn = document.getElementById('dark-mode-toggle');
        toggleBtn.onclick = () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        };
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>
</body>
</html>
