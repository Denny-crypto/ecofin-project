<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFin AI Scan - Solusi Cerdas Plastik</title>
    <link rel="icon" type="image/png" href="Images/Logo.png">
    <link rel="stylesheet" href="Style.Css">
</head>
<body>

    <nav>
        <div class="logo-wrapper">
            <img src="Images/Logo.png" alt="Logo EcoFin" class="nav-logo-img">
            <span class="logo-text">ECOFIN</span>
        </div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-list">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="kalkulator.html">Kalkulator</a></li>
            <li><a href="games.html">Mini Games</a></li>
            <li><a href="scan.html" style="color: var(--accent-blue);">AI Scan</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><button id="dark-mode-toggle">🌙</button></li>
        </ul>
    </nav>

    <div class="calc-container reveal active" style="padding-top: 140px; text-align: center;">
        <h2>EcoFin AI Scanner 📸</h2>
        <p>Arahkan kamera ke sampah plastik (PET, LDPE, PP, atau Styrofoam) untuk deteksi otomatis.</p>
        
        <div id="webcam-container" style="margin: 30px auto; border: 5px solid var(--nature-green); border-radius: 20px; overflow: hidden; width: 320px; height: 240px; background: #000; box-shadow: 0 10px 20px rgba(0,0,0,0.2);"></div>
        
        <button type="button" class="btn-play" onclick="init()" style="padding: 15px 35px; background: var(--nature-green); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s;">Mulai Kamera</button>
        
        <div id="label-container" style="margin-top: 25px; display: flex; flex-direction: column; gap: 10px; align-items: center;"></div>
    </div>

    <script type="text/javascript">
        // Link model Teachable Machine kamu
        const URL = "https://teachablemachine.withgoogle.com/models/ChYCkSsnW/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Load model AI
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Pengaturan Kamera Belakang untuk Mobile
            const width = 320;
            const height = 240;
            const flip = false; // Kamera belakang tidak perlu di-mirror
            webcam = new tmImage.Webcam(width, height, flip); 
            
            // Perintah khusus untuk memicu kamera belakang di HP
            await webcam.setup({ facingMode: "environment" }); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // Masukkan canvas kamera ke dalam wadah
            const container = document.getElementById("webcam-container");
            container.innerHTML = "";
            container.appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "Menunggu deteksi..."; 
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // 1. Cari prediksi dengan probabilitas tertinggi
            let highestProb = 0;
            let bestClassName = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClassName = prediction[i].className;
                }
            }

            // 2. LOGIKA PERINGATAN (THRESHOLD 60%)
            // Jika akurasi tertinggi di bawah 60%, tampilkan pesan error
            if (highestProb < 0.60) {
                labelContainer.innerHTML = `
                    <div style="padding: 15px; background: #ffe5e5; color: #d63031; border-radius: 10px; font-weight: bold; border: 2px solid #ff7675; width: 280px; margin: 0 auto;">
                        ⚠ Sampah Tidak Terdeteksi
                    </div>`;
            } else {
                // Jika terdeteksi di atas 60%, tampilkan nama sampahnya saja
                const probabilityPercent = (highestProb * 100).toFixed(0);
                labelContainer.innerHTML = `
                    <div style="padding: 15px; background: #dff9fb; color: #1b4332; border-radius: 10px; font-weight: bold; border: 2px solid #2d6a4f; width: 280px; margin: 0 auto;">
                        <span style="float: left;">${bestClassName}</span>
                        <span style="float: right;">${probabilityPercent}%</span>
                    </div>`;
            }
        }

        // Script Hamburger Menu agar jalan di HP
        const menu = document.querySelector('#mobile-menu');
        const menuLinks = document.querySelector('.nav-list');
        if(menu) {
            menu.onclick = () => {
                menu.classList.toggle('is-active');
                menuLinks.classList.toggle('active');
            };
        }
    </script>
    
</body>
</html>
