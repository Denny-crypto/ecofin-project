<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFin AI Scan - Solusi Cerdas Plastik</title>
    <link rel="icon" type="image/png" href="Images/Logo.png">
    <link rel="stylesheet" href="Style.Css">
</head>
<body>

    <nav>
        <div class="logo-wrapper">
            <img src="Images/Logo.png" alt="Logo EcoFin" class="nav-logo-img">
            <span class="logo-text">ECOFIN</span>
        </div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-list">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="kalkulator.html">Kalkulator</a></li>
            <li><a href="games.html">Mini Games</a></li>
            <li><a href="scan.html" style="color: var(--accent-blue);">AI Scan</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><button id="dark-mode-toggle">🌙</button></li>
        </ul>
    </nav>

    <div class="calc-container reveal active" style="padding-top: 140px; text-align: center;">
        <h2>EcoFin AI Scanner 📸</h2>
        <p>Arahkan kamera ke sampah plastik (PET, LDPE, PP, atau Styrofoam) untuk deteksi otomatis.</p>
        
        <div id="webcam-container" style="margin: 30px auto; border: 5px solid var(--nature-green); border-radius: 20px; overflow: hidden; width: 320px; height: 240px; background: #000; box-shadow: 0 10px 20px rgba(0,0,0,0.2);"></div>
        
        <button type="button" class="btn-play" onclick="init()" style="padding: 15px 35px; background: var(--nature-green); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s;">Mulai Kamera</button>
        
        <div id="label-container" style="margin-top: 25px; display: flex; flex-direction: column; gap: 10px; align-items: center;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        // LINK MODEL MISTER DENI
        const URL = "https://teachablemachine.withgoogle.com/models/ChYCkSsnW/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Load model dan metadata
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Setup webcam
            const flip = true; 
            webcam = new tmImage.Webcam(320, 240, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // Tampilkan canvas kamera
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; // Bersihkan kontainer
            for (let i = 0; i < maxPredictions; i++) {
                const labelDiv = document.createElement("div");
                labelDiv.style.padding = "10px 20px";
                labelDiv.style.background = "var(--card-bg)";
                labelDiv.style.borderRadius = "10px";
                labelDiv.style.width = "250px";
                labelDiv.style.boxShadow = "0 2px 5px rgba(0,0,0,0.1)";
                labelContainer.appendChild(labelDiv);
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const probability = (prediction[i].probability * 100).toFixed(0);
                const className = prediction[i].className;
                
                // Update teks dan warna berdasarkan probabilitas
                labelContainer.childNodes[i].innerHTML = `
                    <span style="float: left;">${className}</span>
                    <span style="float: right; color: var(--nature-green); font-weight: bold;">${probability}%</span>
                `;
            }
        }

        // Hamburger Menu & Dark Mode Logic (Seragamkan dengan index.html)
        const menu = document.querySelector('#mobile-menu');
        const menuLinks = document.querySelector('.nav-list');
        menu.addEventListener('click', () => {
            menuLinks.classList.toggle('active');
        });

        const toggleBtn = document.getElementById('dark-mode-toggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            toggleBtn.innerText = '☀️';
        }
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            toggleBtn.innerText = isDark ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
